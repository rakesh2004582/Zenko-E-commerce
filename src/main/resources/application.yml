server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: zenko-ecom

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zenko_ecom}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:zenko-super-secret-key-change-this-in-production-min-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    admin-expiration-ms: ${JWT_ADMIN_EXPIRATION_MS:43200000}

  upload:
    dir: ${UPLOAD_DIR:uploads/products}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  emailjs:
    enabled: ${EMAILJS_ENABLED:false}
    api-url: ${EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}
    service-id: ${EMAILJS_SERVICE_ID:}
    public-key: ${EMAILJS_PUBLIC_KEY:}
    private-key: ${EMAILJS_PRIVATE_KEY:}
    admin-email: ${ADMIN_NOTIFY_EMAIL:admin@zenko.com}

    templates:
      welcome: ${EMAILJS_TEMPLATE_WELCOME:}
      order-confirmation: ${EMAILJS_TEMPLATE_ORDER_CONFIRMATION:}
      order-status-update: ${EMAILJS_TEMPLATE_ORDER_STATUS:}
      contact: ${EMAILJS_TEMPLATE_CONTACT:}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    persist-authorization: true

logging:
  level:
    com.zenko: INFO
    com.henoria: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

endpoint:
  health:
      show-details: when_authorized

metrics:
  tags:
      application: ${spring.application.name}    